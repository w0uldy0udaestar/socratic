<svg width="880" height="620" viewBox="0 0 880 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- window -->
  <rect x="1" y="1" width="878" height="618" rx="14" fill="#0b0f14" stroke="#1f2937" stroke-width="2"/>
  <!-- title bar -->
  <path d="M1 15 A14 14 0 0 1 15 1 H865 A14 14 0 0 1 879 15 V44 H1 Z" fill="#111826"/>
  <circle cx="26" cy="23" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="23" r="6.5" fill="#28c840"/>
  <text x="440" y="28" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">claude code — mind-reader gate active</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5">
    <!-- user prompt -->
    <text x="36" y="84"><tspan fill="#3fb950">❯ you</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#e6edf3"> "make the landing page nicer"</tspan></text>

    <!-- protocol engages -->
    <text x="36" y="126"><tspan fill="#ff7a59">◆ mind-reader</tspan><tspan fill="#8b949e"> — 4 plans diverge → asking what changes the outcome</tspan></text>

    <!-- question -->
    <text x="36" y="166" fill="#e6edf3" font-weight="700">? Which kind of "nicer" decides what gets built?</text>
    <text x="66" y="200"><tspan fill="#3fb950" font-weight="700">▸ Tighten spacing &amp; typography only</tspan><tspan fill="#8b949e"> (recommended)</tspan></text>
    <text x="66" y="230" fill="#8b949e">  Full visual redesign — new palette, new layout</text>
    <text x="66" y="258" fill="#8b949e">  Add motion — scroll reveals, hover states</text>
    <text x="66" y="286" fill="#8b949e">  ✎ or type your own…</text>

    <!-- gate denial -->
    <rect x="36" y="310" width="808" height="36" rx="8" fill="#1c1113" stroke="#f85149" stroke-opacity="0.55"/>
    <text x="52" y="334"><tspan fill="#f85149" font-weight="700">✗ Edit(src/Landing.tsx) denied</tspan><tspan fill="#8b949e"> — spec not approved yet</tspan></text>
    <text x="36" y="372" fill="#586069">  reads &amp; research stay open the whole time</text>

    <!-- spec -->
    <text x="36" y="410"><tspan fill="#d29922" font-weight="700">[MR-SPEC]</tspan><tspan fill="#e6edf3"> Tighten spacing/typography on Landing only</tspan></text>
    <text x="148" y="438" fill="#8b949e">✓ chosen: option 1 · ~ assumed: keep palette</text>
    <text x="148" y="466" fill="#8b949e">out of scope: redesign, motion · verify: build + diff</text>

    <!-- approve buttons -->
    <rect x="52" y="488" width="138" height="36" rx="18" fill="#132417" stroke="#2ea043" stroke-width="1.5"/>
    <text x="121" y="511" text-anchor="middle" fill="#3fb950" font-weight="700">✓ Approve</text>
    <rect x="202" y="488" width="200" height="36" rx="18" fill="#0d1420" stroke="#263041"/>
    <text x="302" y="511" text-anchor="middle" fill="#8b949e">✎ Needs changes</text>

    <!-- approved -->
    <text x="36" y="560"><tspan fill="#3fb950" font-weight="700">✓ approved</tspan><tspan fill="#8b949e"> (one click) — gate open · spec archived</tspan></text>
    <text x="36" y="590"><tspan fill="#e6edf3">▸ executing the approved spec.</tspan><tspan fill="#ff7a59"> nothing else.</tspan></text>
  </g>
</svg>
