<svg width="880" height="230" viewBox="0 0 880 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- card -->
  <rect x="1" y="1" width="878" height="228" rx="16" fill="#0b0f14" stroke="#1f2937" stroke-width="2"/>
  <!-- faint grid dots -->
  <g fill="#161d27">
    <circle cx="820" cy="40" r="3"/><circle cx="790" cy="70" r="2"/><circle cx="840" cy="90" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="90" cy="200" r="3"/><circle cx="820" cy="180" r="2"/>
  </g>
  <!-- wordmark with inline cursor (flows with actual font metrics) -->
  <text x="64" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="50" font-weight="700">
    <tspan fill="#3fb950">❯ </tspan><tspan fill="#e6edf3">socratic</tspan><tspan fill="#ff7a59">▊<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan>
  </text>
  <!-- tagline -->
  <text x="66" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e">Your agent shouldn't guess. Clarify → approve (1 click) → execute.</text>
  <!-- stat chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <rect x="64" y="166" width="242" height="34" rx="17" fill="#0d1420" stroke="#263041"/>
    <circle cx="86" cy="183" r="4" fill="#3fb950"/>
    <text x="100" y="188" fill="#c9d1d9">0 LLM calls in hooks</text>

    <rect x="318" y="166" width="234" height="34" rx="17" fill="#0d1420" stroke="#263041"/>
    <circle cx="340" cy="183" r="4" fill="#d29922"/>
    <text x="354" y="188" fill="#c9d1d9">~23ms hook overhead</text>

    <rect x="564" y="166" width="206" height="34" rx="17" fill="#0d1420" stroke="#263041"/>
    <circle cx="586" cy="183" r="4" fill="#f85149"/>
    <text x="600" y="188" fill="#c9d1d9">fail-closed gate</text>
  </g>
</svg>
